<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Scoop Shop – Money Learning Game</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>

/* =============================================
   RESET & ROOT
============================================= */
:root {
  --pink:       #ff6b9d;
  --pink-light: #ffb3d1;
  --purple:     #a855f7;
  --card-bg:    #fffdf9;
  --border:     #ffe4cc;
  --text-dark:  #2d1a0e;
  --text-mid:   #6b4226;
  --success:    #22c55e;
  --fail:       #ef4444;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  width: 100%; height: 100%;
  overflow: hidden;
  font-family: 'Poppins', sans-serif;
  background: #fff8f0;
}

/* Soft radial background */
body::before {
  content: '';
  position: fixed; inset: 0;
  background:
    radial-gradient(circle at 12% 18%, #ffe4f0 0%, transparent 42%),
    radial-gradient(circle at 88% 78%, #dff0ff 0%, transparent 40%),
    radial-gradient(circle at 52% 52%, #fff5e0 0%, transparent 58%);
  pointer-events: none;
  z-index: 0;
}

/* =============================================
   APP SHELL
============================================= */
#app {
  position: relative;
  width: 100%; height: 100%;
  display: flex;
  flex-direction: column;
  z-index: 1;
}

/* =============================================
   HEADER
============================================= */
#header {
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0.4rem 4rem 0.4rem 1rem; /* right padding to not overlap dots */
  background: linear-gradient(135deg, #ff6b9d, #a855f7);
  box-shadow: 0 4px 20px rgba(168,85,247,0.3);
  flex-shrink: 0;
  gap: 0.55rem;
  position: relative;
}

#header h1 {
  color: #fff;
  font-size: clamp(0.9rem, 2.6vw, 1.45rem);
  font-weight: 900;
  letter-spacing: -0.5px;
  text-shadow: 0 2px 8px rgba(0,0,0,0.2);
}

.emoji-title { font-size: clamp(1rem, 2.6vw, 1.5rem); }

/* Progress dots */
#progress-bar {
  display: flex;
  gap: 0.32rem;
  align-items: center;
  position: absolute;
  right: 0.8rem;
}

.prog-dot {
  width: 15px; height: 15px;
  border-radius: 50%;
  background: rgba(255,255,255,0.28);
  border: 2px solid rgba(255,255,255,0.55);
  transition: all 0.4s ease;
  flex-shrink: 0;
}

.prog-dot.filled {
  background: #fff;
  box-shadow: 0 0 8px rgba(255,255,255,0.85);
}

/* =============================================
   GAME AREA
============================================= */
#game-area {
  flex: 1;
  display: flex;
  overflow: hidden;
  min-height: 0;
}

/* =============================================
   LEFT — CONE PANEL
============================================= */
#cone-panel {
  width: 29%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-end;
  padding: 0.5rem 0.3rem 0.9rem;
  position: relative;
  flex-shrink: 0;
}

#cone-label {
  position: absolute;
  top: 0.45rem;
  font-size: clamp(0.48rem, 1.25vw, 0.7rem);
  font-weight: 700;
  color: var(--text-mid);
  background: rgba(255,255,255,0.88);
  padding: 0.18rem 0.5rem;
  border-radius: 20px;
  border: 2px solid var(--border);
  white-space: nowrap;
  z-index: 5;
}

/* The whole cone + scoops assembly bobs together */
#cone-assembly {
  display: flex;
  flex-direction: column;
  align-items: center;
  animation: coneBob 3.2s ease-in-out infinite;
  transform-origin: bottom center;
  position: relative;
  z-index: 2;
}

@keyframes coneBob {
  0%, 100% { transform: translateY(0px) rotate(0deg); }
  30%       { transform: translateY(-6px) rotate(0.6deg); }
  60%       { transform: translateY(-3px) rotate(-0.4deg); }
  80%       { transform: translateY(-7px) rotate(0.3deg); }
}

/* Stack of scoops inside the assembly */
#stacked-scoops {
  display: flex;
  flex-direction: column-reverse;
  align-items: center;
  position: relative;
}

/* Each stacked scoop image wrapper */
.stacked-scoop-wrap {
  /* deep negative margin so scoops truly sit inside each other */
  margin-bottom: clamp(-30px, -6vw, -52px);
  display: block;
  position: relative;
  /* Each scoop sways independently */
  animation: scoopSway 2.8s ease-in-out infinite;
}

/* Stagger sway per child so they don't all move together */
.stacked-scoop-wrap:nth-child(1) { animation-delay: 0s;    animation-duration: 2.9s; }
.stacked-scoop-wrap:nth-child(2) { animation-delay: 0.4s;  animation-duration: 3.1s; }
.stacked-scoop-wrap:nth-child(3) { animation-delay: 0.2s;  animation-duration: 2.7s; }
.stacked-scoop-wrap:nth-child(4) { animation-delay: 0.6s;  animation-duration: 3.3s; }
.stacked-scoop-wrap:nth-child(5) { animation-delay: 0.1s;  animation-duration: 2.6s; }

@keyframes scoopSway {
  0%, 100% { transform: rotate(0deg)   translateX(0px); }
  25%       { transform: rotate(1.2deg) translateX(2px); }
  75%       { transform: rotate(-1deg)  translateX(-2px); }
}

/* The actual image inside the wrapper */
.stacked-scoop-img {
  display: block;
  width: clamp(52px, 9.5vw, 86px);
  height: clamp(52px, 9.5vw, 86px);
  object-fit: contain;
  filter: drop-shadow(0 4px 7px rgba(0,0,0,0.2));
  /* pop-in on land */
  animation: scoopLand 0.38s cubic-bezier(0.175, 0.885, 0.32, 1.275) both;
}

@keyframes scoopLand {
  from { transform: scale(1.2) translateY(-6px); opacity: 0.6; }
  to   { transform: scale(1)   translateY(0);    opacity: 1; }
}

/* Cone SVG */
#cone-svg-wrap {
  width: clamp(52px, 9.5vw, 88px);
  flex-shrink: 0;
  position: relative;
  z-index: 2;
}

/* =============================================
   DIVIDER
============================================= */
#divider {
  width: 4px;
  background: linear-gradient(180deg, var(--pink-light), var(--purple), var(--pink-light));
  border-radius: 4px;
  margin: 0.5rem 0;
  flex-shrink: 0;
  opacity: 0.32;
}

/* =============================================
   RIGHT — MENU PANEL
============================================= */
#menu-panel {
  flex: 1;
  display: flex;
  flex-direction: column;
  padding: 0.4rem 0.5rem 0.5rem;
  overflow: hidden;
  min-width: 0;
}

#menu-title {
  text-align: center;
  font-size: clamp(0.62rem, 1.7vw, 0.92rem);
  font-weight: 800;
  color: var(--text-dark);
  margin-bottom: 0.28rem;
}

/* 3×3 grid */
#flavour-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: clamp(0.22rem, 0.85vw, 0.52rem);
  flex: 1;
  min-height: 0;
  overflow: hidden;
}

/* Flavour card */
.flavour-card {
  background: var(--card-bg);
  border: 2px solid var(--border);
  border-radius: 14px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 0.1rem;
  cursor: pointer;
  transition: transform 0.17s ease, box-shadow 0.17s ease;
  padding: 0.22rem 0.12rem 0.28rem;
  position: relative;
  overflow: hidden;
  min-height: 0;
  touch-action: manipulation;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}

.flavour-card:hover {
  transform: translateY(-3px) scale(1.04);
  box-shadow: 0 8px 22px rgba(0,0,0,0.13);
}

.flavour-card:active { transform: scale(0.96); }

/* Purchased */
.flavour-card.purchased {
  opacity: 0.38;
  cursor: not-allowed;
  transform: none !important;
  box-shadow: none !important;
}

.flavour-card.purchased .purchased-check { display: flex; }

.purchased-check {
  display: none;
  position: absolute;
  inset: 0;
  background: rgba(34,197,94,0.17);
  align-items: center;
  justify-content: center;
  font-size: 1.5rem;
  font-weight: 900;
  color: var(--success);
  border-radius: 12px;
}

/* $10 premium card */
.flavour-card.premium {
  background: linear-gradient(145deg, #160c2e, #2e1065);
  border-color: #7c3aed;
  animation: premiumPulse 2.8s ease-in-out infinite;
}

@keyframes premiumPulse {
  0%,100% { box-shadow: 0 0 16px rgba(124,58,237,0.5), inset 0 0 14px rgba(124,58,237,0.1); }
  50%      { box-shadow: 0 0 32px rgba(168,85,247,0.75), 0 0 52px rgba(168,85,247,0.2), inset 0 0 18px rgba(168,85,247,0.2); }
}

.flavour-card.premium .flavour-name  { color: #ddd6fe; }
.flavour-card.premium .flavour-price {
  color: #fbbf24;
  border-color: rgba(251,191,36,0.45);
  background: rgba(251,191,36,0.13);
}

.premium-stars {
  position: absolute;
  top: 2px; left: 0; right: 0;
  font-size: 0.4rem;
  display: flex;
  justify-content: space-around;
  padding: 0 3px;
  opacity: 0.65;
  color: #fbbf24;
}

/* Scoop image in menu card */
.card-scoop-img {
  width: clamp(36px, 7.5vw, 60px);
  height: clamp(36px, 7.5vw, 60px);
  object-fit: contain;
  flex-shrink: 0;
  filter: drop-shadow(0 2px 4px rgba(0,0,0,0.18));
  /* gentle float on each card */
  animation: cardFloat 3s ease-in-out infinite;
}

/* Stagger card floats across the grid */
.flavour-card:nth-child(1)  .card-scoop-img { animation-delay: 0s;    animation-duration: 3.1s; }
.flavour-card:nth-child(2)  .card-scoop-img { animation-delay: 0.5s;  animation-duration: 2.9s; }
.flavour-card:nth-child(3)  .card-scoop-img { animation-delay: 1.0s;  animation-duration: 3.3s; }
.flavour-card:nth-child(4)  .card-scoop-img { animation-delay: 0.3s;  animation-duration: 2.8s; }
.flavour-card:nth-child(5)  .card-scoop-img { animation-delay: 0.8s;  animation-duration: 3.0s; }
.flavour-card:nth-child(6)  .card-scoop-img { animation-delay: 1.3s;  animation-duration: 3.2s; }
.flavour-card:nth-child(7)  .card-scoop-img { animation-delay: 0.2s;  animation-duration: 2.7s; }
.flavour-card:nth-child(8)  .card-scoop-img { animation-delay: 0.7s;  animation-duration: 3.4s; }
.flavour-card:nth-child(9)  .card-scoop-img { animation-delay: 1.1s;  animation-duration: 3.0s; }

@keyframes cardFloat {
  0%, 100% { transform: translateY(0px); }
  50%       { transform: translateY(-4px); }
}

.flavour-name {
  font-size: clamp(0.36rem, 1.02vw, 0.63rem);
  font-weight: 700;
  color: var(--text-dark);
  text-align: center;
  line-height: 1.2;
  padding: 0 2px;
}

.flavour-price {
  font-size: clamp(0.4rem, 1.15vw, 0.7rem);
  font-weight: 800;
  color: var(--pink);
  background: rgba(255,107,157,0.1);
  padding: 0.06rem 0.28rem;
  border-radius: 20px;
  border: 1.5px solid rgba(255,107,157,0.3);
}

/* =============================================
   FALLING SCOOP — drops from above, fades out
   just before the real stacked scoop appears.
   We never fade the real scoop; only this clone.
============================================= */
.falling-scoop-anim {
  position: fixed;
  z-index: 201;           /* above particles */
  pointer-events: none;
  animation: scoopDrop 0.65s cubic-bezier(0.35, 0, 0.2, 1) forwards;
}

.falling-scoop-anim img {
  width: 100%; height: 100%;
  object-fit: contain;
  filter: drop-shadow(0 6px 12px rgba(0,0,0,0.25));
}

@keyframes scoopDrop {
  0%   { transform: translateY(-160px) scale(1.25) rotate(-4deg); opacity: 0; }
  30%  { opacity: 1; }
  72%  { transform: translateY(8px) scale(1.04) rotate(1deg); opacity: 1; }
  86%  { transform: translateY(-3px) scale(0.98) rotate(-0.4deg); opacity: 1; }
  /* Fade out in the last 8% so the real scoop underneath is already there */
  92%  { opacity: 1; }
  100% { transform: translateY(0) scale(1) rotate(0deg); opacity: 0; }
}

/* =============================================
   PARTICLE — subtle landing ripple/sparkle
   Only goes sideways & upward (not below scoop)
   z-index 200 = above cone, below falling clone
============================================= */
.particle {
  position: fixed;
  border-radius: 50%;
  pointer-events: none;
  z-index: 200;
  animation: particleBurst var(--dur, 0.55s) ease-out forwards;
}

@keyframes particleBurst {
  0%   { transform: translate(0, 0) scale(1); opacity: 0.9; }
  100% { transform: translate(var(--tx, 0px), var(--ty, 0px)) scale(0); opacity: 0; }
}

.particle.star {
  border-radius: 0;
  clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
}

/* =============================================
   PAYMENT MODAL
============================================= */
#modal-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.5);
  backdrop-filter: blur(7px);
  z-index: 100;
  align-items: center;
  justify-content: center;
  padding: 1rem;
}

#modal-overlay.active { display: flex; }

#payment-modal {
  background: var(--card-bg);
  border-radius: 24px;
  padding: clamp(0.85rem, 2.8vw, 1.75rem);
  max-width: 460px;
  width: 100%;
  box-shadow: 0 24px 60px rgba(0,0,0,0.27);
  animation: modalPop 0.32s cubic-bezier(0.175,0.885,0.32,1.275) forwards;
  border: 3px solid var(--border);
}

@keyframes modalPop {
  from { transform: scale(0.72) translateY(28px); opacity: 0; }
  to   { transform: scale(1) translateY(0); opacity: 1; }
}

#modal-header { text-align: center; margin-bottom: 0.75rem; }

/* Modal scoop image */
#modal-scoop-preview {
  display: flex;
  justify-content: center;
  margin-bottom: 0.35rem;
}

#modal-scoop-preview img {
  width: clamp(58px, 13vw, 88px);
  height: clamp(58px, 13vw, 88px);
  object-fit: contain;
  filter: drop-shadow(0 4px 10px rgba(0,0,0,0.2));
  animation: modalScoopFloat 2.5s ease-in-out infinite;
}

@keyframes modalScoopFloat {
  0%, 100% { transform: translateY(0); }
  50%       { transform: translateY(-5px); }
}

#modal-title {
  font-size: clamp(0.82rem, 2.2vw, 1.15rem);
  font-weight: 800;
  color: var(--text-dark);
}

#modal-subtitle {
  font-size: clamp(0.62rem, 1.5vw, 0.82rem);
  color: var(--text-mid);
  margin-top: 0.12rem;
}

#modal-price-badge {
  display: inline-block;
  font-size: clamp(0.92rem, 2.5vw, 1.25rem);
  font-weight: 900;
  color: #fff;
  background: linear-gradient(135deg, var(--pink), var(--purple));
  padding: 0.22rem 1.1rem;
  border-radius: 30px;
  margin-top: 0.38rem;
  box-shadow: 0 4px 14px rgba(168,85,247,0.4);
}

/* 2×2 money grid */
#money-options {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: clamp(0.42rem, 1.7vw, 0.72rem);
  margin-top: 0.72rem;
}

.money-btn {
  background: #fff;
  border: 2.5px solid var(--border);
  border-radius: 14px;
  padding: 0.4rem;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.18s ease;
  min-height: 44px;
  /* Make the button a fixed aspect ratio so image fills it */
  aspect-ratio: 3 / 2;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
  overflow: hidden;
}

.money-btn:hover {
  border-color: var(--purple);
  transform: translateY(-2px);
  box-shadow: 0 5px 15px rgba(168,85,247,0.22);
}

.money-btn:active { transform: scale(0.95); }

/* Image fills the button, centered, no label needed */
.money-btn img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  display: block;
}

.money-btn .money-placeholder {
  width: 100%;
  height: 100%;
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 900;
  font-size: clamp(1rem, 3vw, 1.4rem);
  color: #fff;
}

/* Label hidden — money image speaks for itself */
.money-btn .money-label { display: none; }

.money-btn.correct {
  border-color: var(--success);
  background: rgba(34,197,94,0.1);
  animation: correctPulse 0.42s ease;
}

.money-btn.wrong {
  border-color: var(--fail);
  background: rgba(239,68,68,0.1);
  animation: wrongShake 0.42s ease;
}

@keyframes correctPulse {
  0%   { transform: scale(1); }
  50%  { transform: scale(1.07); }
  100% { transform: scale(1); }
}

@keyframes wrongShake {
  0%,100% { transform: translateX(0); }
  20%     { transform: translateX(-7px); }
  40%     { transform: translateX(7px); }
  60%     { transform: translateX(-4px); }
  80%     { transform: translateX(4px); }
}

#feedback-msg {
  text-align: center;
  font-size: clamp(0.72rem, 1.8vw, 0.92rem);
  font-weight: 700;
  margin-top: 0.6rem;
  min-height: 1.35rem;
}

#feedback-msg.correct-text { color: var(--success); }
#feedback-msg.wrong-text   { color: var(--fail); }

/* =============================================
   WIN SCREEN
============================================= */
#win-screen {
  display: none;
  position: fixed;
  inset: 0;
  background: linear-gradient(135deg, #ff6b9d, #a855f7, #60a5fa);
  z-index: 300;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  text-align: center;
  padding: 1.5rem;
  gap: 0.45rem;
}

#win-screen.active { display: flex; }

#win-screen h2 {
  font-size: clamp(1.5rem, 5vw, 2.8rem);
  font-weight: 900;
  color: #fff;
  text-shadow: 0 4px 18px rgba(0,0,0,0.2);
}

#win-screen p {
  font-size: clamp(0.75rem, 2vw, 1rem);
  color: rgba(255,255,255,0.92);
  max-width: 360px;
}

/* Mini cone display on win screen */
#win-cone-display {
  display: flex;
  flex-direction: column;
  align-items: center;
  margin: 0.3rem 0;
  animation: coneBob 3.2s ease-in-out infinite;
}

#win-scoops {
  display: flex;
  flex-direction: column-reverse;
  align-items: center;
}

.win-scoop-img {
  display: block;
  width: clamp(48px, 9vw, 70px);
  height: clamp(48px, 9vw, 70px);
  object-fit: contain;
  margin-bottom: clamp(-22px, -4.5vw, -38px);
  filter: drop-shadow(0 3px 6px rgba(0,0,0,0.22));
  animation: scoopSway 2.8s ease-in-out infinite;
}

.win-scoop-img:nth-child(1) { animation-delay: 0s; }
.win-scoop-img:nth-child(2) { animation-delay: 0.35s; }
.win-scoop-img:nth-child(3) { animation-delay: 0.15s; }
.win-scoop-img:nth-child(4) { animation-delay: 0.5s; }
.win-scoop-img:nth-child(5) { animation-delay: 0.25s; }

#play-again-btn {
  background: #fff;
  color: var(--purple);
  border: none;
  border-radius: 50px;
  padding: clamp(0.65rem, 1.7vw, 0.9rem) clamp(1.7rem, 4vw, 2.6rem);
  font-family: 'Poppins', sans-serif;
  font-size: clamp(0.85rem, 2vw, 1.05rem);
  font-weight: 800;
  cursor: pointer;
  box-shadow: 0 8px 26px rgba(0,0,0,0.2);
  transition: all 0.2s ease;
  touch-action: manipulation;
  min-height: 48px;
  -webkit-tap-highlight-color: transparent;
  margin-top: 0.4rem;
}

#play-again-btn:hover  { transform: translateY(-3px) scale(1.05); box-shadow: 0 12px 34px rgba(0,0,0,0.27); }
#play-again-btn:active { transform: scale(0.96); }

/* Confetti */
.confetti-piece {
  position: fixed;
  border-radius: 2px;
  animation: confettiFall linear forwards;
  pointer-events: none;
  z-index: 400;
}

@keyframes confettiFall {
  0%   { transform: translateY(-20px) rotate(0deg); opacity: 1; }
  100% { transform: translateY(110vh) rotate(720deg); opacity: 0; }
}

/* =============================================
   RESPONSIVE
============================================= */
@media (max-width: 420px) {
  #cone-panel { width: 31%; }
  .flavour-card { border-radius: 10px; }
}

@media (max-height: 560px) {
  #header { padding: 0.22rem 4rem 0.22rem 0.8rem; }
  #header h1 { font-size: 0.82rem; }
  .prog-dot { width: 11px; height: 11px; }
}

</style>
</head>
<body>
<div id="app">

  <!-- HEADER -->
  <div id="header">
    <span class="emoji-title">🍦</span>
    <h1>Scoop Shop</h1>
    <span class="emoji-title">🍦</span>
    <div id="progress-bar">
      <div class="prog-dot" id="dot-1"></div>
      <div class="prog-dot" id="dot-2"></div>
      <div class="prog-dot" id="dot-3"></div>
      <div class="prog-dot" id="dot-4"></div>
      <div class="prog-dot" id="dot-5"></div>
    </div>
  </div>

  <!-- GAME AREA -->
  <div id="game-area">

    <!-- LEFT: CONE PANEL -->
    <div id="cone-panel">
      <div id="cone-label">Your Cone 🍦</div>

      <!-- The whole assembly bobs as one unit -->
      <div id="cone-assembly">
        <div id="stacked-scoops"></div>

        <!-- Waffle cone SVG -->
        <div id="cone-svg-wrap">
          <svg viewBox="0 0 100 132" xmlns="http://www.w3.org/2000/svg"
               style="width:100%;height:auto;display:block;">
            <defs>
              <linearGradient id="cG" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%"   style="stop-color:#fcd34d"/>
                <stop offset="100%" style="stop-color:#b45309"/>
              </linearGradient>
              <linearGradient id="cS" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%"   style="stop-color:#7c2d12;stop-opacity:0.32"/>
                <stop offset="55%"  style="stop-color:transparent"/>
                <stop offset="100%" style="stop-color:#7c2d12;stop-opacity:0.16"/>
              </linearGradient>
            </defs>
            <polygon points="50,130 4,18 96,18" fill="url(#cG)"/>
            <polygon points="50,130 4,18 96,18" fill="url(#cS)"/>
            <!-- vertical waffle lines -->
            <line x1="50" y1="130" x2="13" y2="26" stroke="#92400e" stroke-width="1"   opacity="0.5"/>
            <line x1="50" y1="130" x2="31" y2="18" stroke="#92400e" stroke-width="1"   opacity="0.5"/>
            <line x1="50" y1="130" x2="50" y2="18" stroke="#92400e" stroke-width="1"   opacity="0.5"/>
            <line x1="50" y1="130" x2="69" y2="18" stroke="#92400e" stroke-width="1"   opacity="0.5"/>
            <line x1="50" y1="130" x2="87" y2="26" stroke="#92400e" stroke-width="1"   opacity="0.5"/>
            <!-- horizontal waffle lines -->
            <line x1="9"  y1="34" x2="91" y2="34" stroke="#92400e" stroke-width="1"   opacity="0.4"/>
            <line x1="15" y1="50" x2="85" y2="50" stroke="#92400e" stroke-width="1"   opacity="0.4"/>
            <line x1="22" y1="67" x2="78" y2="67" stroke="#92400e" stroke-width="1"   opacity="0.4"/>
            <line x1="30" y1="85" x2="70" y2="85" stroke="#92400e" stroke-width="1"   opacity="0.4"/>
            <line x1="38" y1="104" x2="62" y2="104" stroke="#92400e" stroke-width="1" opacity="0.4"/>
            <!-- rim highlight -->
            <rect x="4" y="13" width="92" height="9" rx="4.5" fill="#fde68a" opacity="0.72"/>
          </svg>
        </div>
      </div><!-- /cone-assembly -->
    </div><!-- /cone-panel -->

    <div id="divider"></div>

    <!-- RIGHT: MENU PANEL -->
    <div id="menu-panel">
      <div id="menu-title">🍨 Pick a Scoop!</div>
      <div id="flavour-grid"></div>
    </div>

  </div><!-- /game-area -->
</div><!-- /app -->

<!-- PAYMENT MODAL -->
<div id="modal-overlay">
  <div id="payment-modal">
    <div id="modal-header">
      <div id="modal-scoop-preview"></div>
      <div id="modal-title"></div>
      <div id="modal-subtitle">Which coin or note do you need?</div>
      <div id="modal-price-badge"></div>
    </div>
    <div id="money-options"></div>
    <div id="feedback-msg"></div>
  </div>
</div>

<!-- WIN SCREEN -->
<div id="win-screen">
  <div style="font-size:2.6rem;">🎉</div>
  <h2>Yummy! Well Done!</h2>
  <p>You bought 5 delicious scoops and paid with the right money every time!</p>
  <div id="win-cone-display">
    <div id="win-scoops"></div>
    <!-- mini cone -->
    <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"
         style="width:clamp(52px,9vw,72px);height:auto;display:block;margin:-26px auto 0;position:relative;z-index:1;">
      <defs>
        <linearGradient id="cG2" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%"   style="stop-color:#fcd34d"/>
          <stop offset="100%" style="stop-color:#b45309"/>
        </linearGradient>
      </defs>
      <polygon points="50,98 4,12 96,12" fill="url(#cG2)"/>
      <line x1="50" y1="98" x2="50" y2="12" stroke="#92400e" stroke-width="1.2" opacity="0.5"/>
      <line x1="10" y1="28" x2="90" y2="28" stroke="#92400e" stroke-width="1.2" opacity="0.4"/>
      <line x1="18" y1="48" x2="82" y2="48" stroke="#92400e" stroke-width="1.2" opacity="0.4"/>
      <line x1="30" y1="68" x2="70" y2="68" stroke="#92400e" stroke-width="1.2" opacity="0.4"/>
      <rect x="4" y="8" width="92" height="7" rx="3.5" fill="#fde68a" opacity="0.72"/>
    </svg>
  </div>
  <button id="play-again-btn">🔄 Play Again!</button>
</div>

<script>
/* =============================================
   ASSETS PATH
============================================= */
const ASSETS = 'assets/';

/* =============================================
   FLAVOUR DATA
   Grid order is intentionally scrambled — cents
   and dollars are mixed so kids can't predict by position.
============================================= */
const FLAVOURS = [
  // Row 1 — 5¢ | $1 | 10¢
  { id:'chocolate',        name:'Chocolate',          price:'5c',  priceDisplay:'5¢',  premium:false },
  { id:'mintchoc',         name:'Mint Choc Chip',     price:'1d',  priceDisplay:'$1',  premium:false },
  { id:'strawberry',       name:'Strawberry',         price:'10c', priceDisplay:'10¢', premium:false },

  // Row 2 — $5 | 20¢ | $2
  { id:'paddlepop',        name:'Paddle Pop',         price:'5d',  priceDisplay:'$5',  premium:false },
  { id:'vanilla',          name:'Vanilla',            price:'20c', priceDisplay:'20¢', premium:false },
  { id:'cookiescream',     name:'Cookies & Cream',    price:'2d',  priceDisplay:'$2',  premium:false },

  // Row 3 — 50¢ | $2 | $10 ★
  { id:'caramel',          name:'Caramel',            price:'50c', priceDisplay:'50¢', premium:false },
  { id:'blueberry',        name:'Blueberry Fruit',    price:'2d',  priceDisplay:'$2',  premium:false },
  { id:'galaxy',           name:'Galaxy Swirl',       price:'10d', priceDisplay:'$10', premium:true  },
];

/* =============================================
   MONEY CONFIG
============================================= */
const MONEY = {
  '5c':  { file:'5c.png',   label:'5 cents',   fallbackBg:'#b08830', fallbackText:'5¢'  },
  '10c': { file:'10c.png',  label:'10 cents',  fallbackBg:'#909090', fallbackText:'10¢' },
  '20c': { file:'20c.png',  label:'20 cents',  fallbackBg:'#909090', fallbackText:'20¢' },
  '50c': { file:'50c.png',  label:'50 cents',  fallbackBg:'#909090', fallbackText:'50¢' },
  '1d':  { file:'1d.png',   label:'$1',        fallbackBg:'#a0a0a0', fallbackText:'$1'  },
  '2d':  { file:'2d.png',   label:'$2',        fallbackBg:'#a0a0a0', fallbackText:'$2'  },
  '5d':  { file:'5d.png',   label:'$5',        fallbackBg:'#3aad70', fallbackText:'$5'  },
  '10d': { file:'10d.png',  label:'$10',       fallbackBg:'#8b3af7', fallbackText:'$10' },
};

/* Particle colours per flavour (sprinkle burst colours) */
const PARTICLE_COLORS = {
  chocolate:    ['#6b3a2a','#a05030','#fcd34d','#fff'],
  mintchoc:     ['#48b888','#2d7a55','#3b1f0a','#a0edd0'],
  strawberry:   ['#e8526a','#f9a8b4','#fff','#fbbf24'],
  paddlepop:    ['#f97316','#ef4444','#facc15','#4ade80','#60a5fa'],
  vanilla:      ['#fde68a','#fbbf24','#fff','#f0b84a'],
  cookiescream: ['#2a1f1a','#e8e0d8','#fff','#c8beb4'],
  caramel:      ['#c07828','#f0b84a','#fff','#7a4510'],
  blueberry:    ['#6366f1','#312e81','#c7d2fe','#a5b4fc'],
  galaxy:       ['#a855f7','#7c3aed','#fde68a','#bfdbfe','#e9d5ff'],
};

/* =============================================
   GAME STATE
============================================= */
let purchased      = [];
let currentFlavour = null;
let answering      = false;

/* =============================================
   BUILD MENU
============================================= */
function buildMenu() {
  const grid = document.getElementById('flavour-grid');
  grid.innerHTML = '';

  FLAVOURS.forEach(f => {
    const card = document.createElement('div');
    card.className = 'flavour-card' + (f.premium ? ' premium' : '');
    card.dataset.id = f.id;

    if (f.premium) {
      const stars = document.createElement('div');
      stars.className = 'premium-stars';
      stars.textContent = '✦ ✦ ✦ ✦ ✦';
      card.appendChild(stars);
    }

    // Scoop image
    const img = document.createElement('img');
    img.src = ASSETS + f.id + '.png';
    img.alt = f.name;
    img.className = 'card-scoop-img';
    // Fallback: show a coloured circle if image missing
    img.onerror = function() {
      this.style.display = 'none';
      const fb = document.createElement('div');
      fb.style.cssText = `width:clamp(36px,7.5vw,60px);height:clamp(36px,7.5vw,60px);
        border-radius:50%;background:${getFallbackColor(f.id)};
        flex-shrink:0;display:flex;align-items:center;justify-content:center;
        font-size:1.4rem;filter:drop-shadow(0 2px 4px rgba(0,0,0,0.18));`;
      fb.textContent = '🍨';
      this.parentNode.insertBefore(fb, this.nextSibling);
    };

    const name = document.createElement('div');
    name.className = 'flavour-name';
    name.textContent = f.name;

    const price = document.createElement('div');
    price.className = 'flavour-price';
    price.textContent = f.priceDisplay;

    const check = document.createElement('div');
    check.className = 'purchased-check';
    check.textContent = '✓';

    card.appendChild(img);
    card.appendChild(name);
    card.appendChild(price);
    card.appendChild(check);

    card.addEventListener('click', () => onFlavourClick(f.id));
    card.addEventListener('touchend', e => {
      e.preventDefault();
      onFlavourClick(f.id);
    }, { passive: false });

    grid.appendChild(card);
  });
}

/* Simple fallback color for missing images */
function getFallbackColor(id) {
  const map = {
    chocolate:'#6b3a2a', mintchoc:'#48b888', strawberry:'#e8526a',
    paddlepop:'#f97316', vanilla:'#fde68a',   cookiescream:'#e8e0d8',
    caramel:'#c07828',   blueberry:'#6366f1', galaxy:'#312e81'
  };
  return map[id] || '#ccc';
}

/* =============================================
   FLAVOUR CLICK → OPEN MODAL
============================================= */
function onFlavourClick(id) {
  if (purchased.includes(id)) return;
  if (purchased.length >= 5) return;
  const flavour = FLAVOURS.find(f => f.id === id);
  if (!flavour) return;
  currentFlavour = flavour;
  openModal(flavour);
}

/* =============================================
   OPEN MODAL
============================================= */
function openModal(flavour) {
  const preview = document.getElementById('modal-scoop-preview');
  preview.innerHTML = '';
  const img = document.createElement('img');
  img.src = ASSETS + flavour.id + '.png';
  img.alt = flavour.name;
  img.onerror = function() {
    this.style.display = 'none';
  };
  preview.appendChild(img);

  document.getElementById('modal-title').textContent     = flavour.name + ' Ice Cream';
  document.getElementById('modal-price-badge').textContent = flavour.priceDisplay;
  document.getElementById('feedback-msg').textContent    = '';
  document.getElementById('feedback-msg').className      = '';

  renderMoneyOptions(buildMoneyOptions(flavour.price), flavour.price);
  document.getElementById('modal-overlay').classList.add('active');
  answering = false;
}

/* =============================================
   BUILD MONEY OPTIONS (1 correct + 3 random wrong)
============================================= */
function buildMoneyOptions(correctKey) {
  const wrongs = Object.keys(MONEY).filter(k => k !== correctKey);
  shuffle(wrongs);
  const opts = [correctKey, ...wrongs.slice(0, 3)];
  shuffle(opts);
  return opts;
}

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
}

/* =============================================
   RENDER MONEY BUTTONS
============================================= */
function renderMoneyOptions(options, correctKey) {
  const container = document.getElementById('money-options');
  container.innerHTML = '';
  options.forEach(key => {
    const m = MONEY[key];
    const btn = document.createElement('button');
    btn.className = 'money-btn';
    btn.dataset.key = key;
    btn.innerHTML = `
      <img src="${ASSETS}${m.file}" alt="${m.label}"
        onerror="this.style.display='none';this.nextElementSibling.style.display='flex';" loading="lazy"/>
      <div class="money-placeholder" style="background:${m.fallbackBg};display:none;">${m.fallbackText}</div>
      <div class="money-label">${m.label}</div>
    `;
    btn.addEventListener('click', () => onMoneyClick(key, correctKey, btn));
    btn.addEventListener('touchend', e => {
      e.preventDefault();
      onMoneyClick(key, correctKey, btn);
    }, { passive: false });
    container.appendChild(btn);
  });
}

/* =============================================
   ANSWER CHECK
============================================= */
function onMoneyClick(chosen, correct, btn) {
  if (answering) return;
  answering = true;
  const msg = document.getElementById('feedback-msg');

  if (chosen === correct) {
    btn.classList.add('correct');
    msg.textContent = '🎉 Correct! Great job!';
    msg.className = 'correct-text';
    setTimeout(() => {
      closeModal();
      addScoop(currentFlavour);
      purchased.push(currentFlavour.id);
      markPurchased(currentFlavour.id);
      updateProgress();
      if (purchased.length >= 5) setTimeout(showWinScreen, 950);
    }, 900);
  } else {
    btn.classList.add('wrong');
    msg.textContent = '❌ Not quite — try again!';
    msg.className = 'wrong-text';
    setTimeout(() => {
      btn.classList.remove('wrong');
      msg.textContent = '';
      msg.className = '';
      answering = false;
    }, 1000);
  }
}

/* =============================================
   CLOSE MODAL
============================================= */
function closeModal() {
  document.getElementById('modal-overlay').classList.remove('active');
}

/* =============================================
   ADD SCOOP
   Strategy:
   1. Add the real stacked scoop to the DOM straight away
      (it's hidden under the cone-assembly bob layer).
   2. Overlay an animated falling clone on top.
   3. When the clone's drop arc hits bottom (~480ms),
      fire small side-ripple particles around the edge.
   4. Clone fades out at the end — real scoop is already there,
      so there is ZERO disappearing gap.
============================================= */
function addScoop(flavour) {
  const coneWrap = document.getElementById('cone-svg-wrap');
  const stackDiv = document.getElementById('stacked-scoops');
  const existing = stackDiv.children.length;

  /* ── 1. ADD REAL SCOOP TO STACK IMMEDIATELY ── */
  const wrap = document.createElement('div');
  wrap.className = 'stacked-scoop-wrap';
  const realImg = document.createElement('img');
  realImg.src = ASSETS + flavour.id + '.png';
  realImg.alt = flavour.name;
  realImg.className = 'stacked-scoop-img';
  wrap.appendChild(realImg);
  stackDiv.appendChild(wrap);

  /* ── 2. MEASURE where the real scoop ended up on screen ── */
  // Wait one frame so layout is computed
  requestAnimationFrame(() => {
    const scoopPx = Math.min(86, Math.max(52, window.innerWidth * 0.095));
    const coneRect = coneWrap.getBoundingClientRect();
    const cx = coneRect.left + coneRect.width / 2;

    // Landing Y: match the real scoop's visual centre
    const overlapPx = scoopPx * 0.58;  // matches CSS clamp overlap
    const landY = coneRect.top
      - scoopPx * 0.55               // first scoop sits over rim
      - existing * (scoopPx - overlapPx); // subsequent scoops stack up

    /* ── 3. FALLING CLONE — animates in from above ── */
    const fly = document.createElement('div');
    fly.className = 'falling-scoop-anim';
    fly.style.cssText = `
      left: ${cx - scoopPx / 2}px;
      top:  ${landY}px;
      width: ${scoopPx}px;
      height: ${scoopPx}px;
    `;
    const flyImg = document.createElement('img');
    flyImg.src = ASSETS + flavour.id + '.png';
    flyImg.alt = flavour.name;
    fly.appendChild(flyImg);
    document.body.appendChild(fly);

    /* ── 4. PARTICLES — fire when clone hits bottom of arc (~72% of 650ms) ── */
    setTimeout(() => {
      spawnParticles(cx, landY + scoopPx * 0.5, flavour.id);
    }, 470);

    /* Remove clone once its animation ends */
    fly.addEventListener('animationend', () => fly.remove());
  });
}

/* =============================================
   PARTICLE BURST — gentle landing ripple
   Fires sideways & slightly upward around the
   edge of where the scoop lands. Small, quick,
   does NOT obscure the scoop underneath.
============================================= */
function spawnParticles(x, y, flavourId) {
  const colors = PARTICLE_COLORS[flavourId] || ['#ff6b9d','#fbbf24','#a855f7','#fff'];
  const count  = 14;  // fewer = less visual clutter

  for (let i = 0; i < count; i++) {
    const p = document.createElement('div');
    const isStar = i % 5 === 0;
    p.className  = 'particle' + (isStar ? ' star' : '');

    const size = isStar
      ? 5 + Math.random() * 5
      : 4 + Math.random() * 5;

    // Spread in a mostly-sideways arc: -150° to -30° = upward semicircle
    // plus left/right at ±90°. Avoid going downward (0°–180° excluded).
    const baseAngle = -150 + (i / count) * 300;  // -150° → +150°
    const angle = baseAngle + (Math.random() - 0.5) * 25;
    const dist  = 18 + Math.random() * 28;       // short travel distance
    const rad   = angle * Math.PI / 180;
    const tx    = Math.cos(rad) * dist;
    const ty    = Math.sin(rad) * dist;
    const dur   = 0.3 + Math.random() * 0.2;     // quick burst

    const color = colors[Math.floor(Math.random() * colors.length)];

    p.style.cssText = `
      left: ${x - size / 2}px;
      top:  ${y - size / 2}px;
      width:  ${size}px;
      height: ${size}px;
      background: ${color};
      --tx: ${tx}px;
      --ty: ${ty}px;
      --dur: ${dur}s;
    `;

    document.body.appendChild(p);
    p.addEventListener('animationend', () => p.remove());
  }
}

/* =============================================
   MARK CARD PURCHASED
============================================= */
function markPurchased(id) {
  const card = document.querySelector(`.flavour-card[data-id="${id}"]`);
  if (card) card.classList.add('purchased');
}

/* =============================================
   PROGRESS DOTS
============================================= */
function updateProgress() {
  for (let i = 1; i <= 5; i++) {
    document.getElementById(`dot-${i}`)
      .classList.toggle('filled', i <= purchased.length);
  }
}

/* =============================================
   WIN SCREEN
============================================= */
function showWinScreen() {
  const winScoops = document.getElementById('win-scoops');
  winScoops.innerHTML = '';

  purchased.forEach(id => {
    const f = FLAVOURS.find(x => x.id === id);
    if (!f) return;
    const img = document.createElement('img');
    img.src = ASSETS + f.id + '.png';
    img.alt = f.name;
    img.className = 'win-scoop-img';
    winScoops.appendChild(img);
  });

  document.getElementById('win-screen').classList.add('active');
  launchConfetti();
}

/* =============================================
   CONFETTI
============================================= */
function launchConfetti() {
  const colors = ['#ff6b9d','#a855f7','#fbbf24','#34d399','#60a5fa','#fb7185','#f97316'];
  for (let i = 0; i < 90; i++) {
    const c = document.createElement('div');
    c.className = 'confetti-piece';
    c.style.cssText = `
      left: ${Math.random() * 100}vw;
      top: -12px;
      background: ${colors[Math.floor(Math.random() * colors.length)]};
      width:  ${6 + Math.random() * 8}px;
      height: ${6 + Math.random() * 8}px;
      border-radius: ${Math.random() > 0.5 ? '50%' : '2px'};
      animation-duration: ${1.4 + Math.random() * 2.2}s;
      animation-delay: ${Math.random() * 0.9}s;
    `;
    document.body.appendChild(c);
    c.addEventListener('animationend', () => c.remove());
  }
}

/* =============================================
   RESET / PLAY AGAIN
============================================= */
function resetGame() {
  purchased      = [];
  currentFlavour = null;
  answering      = false;

  document.getElementById('stacked-scoops').innerHTML = '';
  updateProgress();
  buildMenu();
  document.getElementById('win-screen').classList.remove('active');
  closeModal();
}

/* =============================================
   EVENT WIRING
============================================= */
document.getElementById('modal-overlay').addEventListener('click', function(e) {
  if (e.target === this) closeModal();
});

const playBtn = document.getElementById('play-again-btn');
playBtn.addEventListener('click', resetGame);
playBtn.addEventListener('touchend', e => {
  e.preventDefault();
  resetGame();
}, { passive: false });

/* =============================================
   INIT
============================================= */
buildMenu();
</script>
